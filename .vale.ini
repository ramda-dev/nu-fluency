# Vale prose lint for the skill corpus. Run from the repo root:
#   vale skills/
# The built-in Vale style checks spelling and repeated words. Nushell terms
# live in .vale/styles/config/vocabularies/Nushell/accept.txt. To lint with
# another style set (for example the markdown-toolkit rules), put its style
# folder under .vale/styles/ and add it to BasedOnStyles.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Nushell

[*.md]
BasedOnStyles = Vale
