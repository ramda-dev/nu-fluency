# Vale prose lint for the skill corpus. Run from the repo root:
#   vale skills/
# The built-in Vale style checks spelling and repeated words. Nushell terms
# live in .vale/styles/config/vocabularies/Nushell/accept.txt.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Nushell

[*.md]
BasedOnStyles = Vale
